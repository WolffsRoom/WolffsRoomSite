name: Publicar no GitHub Pages
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 */6 * * *' # refresh release catalogs
    - cron: '45 1 * * *' # 22:45 BRT: expire one-day Home feature
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # necessário para a data da última mudança de cada post
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyyaml pillow segno
      - name: Gerar o site (e o store.json do app do Vita)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Public HTTPS Worker URL set as a repository variable after deployment.
          WOLFFS_POLL_API_URL: ${{ vars.WOLFFS_POLL_API_URL }}
        run: python tools/build.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      # The 100+ MB site artifact can take a few seconds to appear in the
      # Pages deployment artifact lookup after upload-artifact succeeds.
      - name: Wait for Pages artifact indexing
        run: sleep 25
      - id: deployment
        uses: actions/deploy-pages@v4
