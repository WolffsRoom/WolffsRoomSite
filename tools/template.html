<style>
body{margin:0;background:#060606}
a{color:#ffffff}a:hover{color:#bdbdbd}
.wr-root{position:relative;-webkit-font-smoothing:none;font-smooth:never;text-rendering:optimizeSpeed}
.wr-root::before{content:"";position:absolute;inset:0;background:url(assets/edgeL.png) left top / 480px 768px repeat-y,url(assets/edgeR.png) right top / 480px 768px repeat-y;image-rendering:pixelated;pointer-events:none}
@media (max-width:1000px){.wr-root::before{background-size:240px 384px,240px 384px}}
.wr-root>*{position:relative}
.wr-div{width:640px;max-width:100%;height:20px;background:url(assets/divider.png) center / 640px 20px no-repeat;image-rendering:pixelated}
.wr-sh,.wr-sh-s{position:relative}
.wr-l{display:inline-block;padding-bottom:10px;margin-bottom:-10px;transition:transform .12s steps(2,end)}
.wr-l:hover{transform:translateY(-10px)}
@media (prefers-reduced-motion:reduce){.wr-l{transition:none}}
.wr-sh::before{content:"";position:absolute;inset:-28px;border:24px solid transparent;border-image:url(assets/halo24.png) 24 round;image-rendering:pixelated;pointer-events:none}
.wr-sh-s::before{content:"";position:absolute;inset:-16px;border:12px solid transparent;border-image:url(assets/halo12.png) 12 round;image-rendering:pixelated;pointer-events:none;opacity:.75}
.wr-sh-s:hover::before{opacity:1}
section.wr-sh{border:0 !important}
.wr-card{text-align:center}
.wr-grid{display:flex !important;flex-wrap:wrap;justify-content:center}
.wr-grid>*{flex:0 1 calc((100% - 72px) / 3);min-width:260px;box-sizing:border-box}
section.wr-sh>div:last-child{flex-direction:column !important;align-items:center !important;text-align:center}
section.wr-sh>div:last-child>div{flex:0 1 auto !important;width:100%;max-width:100% !important;align-items:center}
section.wr-sh>div:last-child>div:first-child>div{justify-content:center;width:100%}
section.wr-sh>div:last-child>div:last-child{max-width:640px !important;flex-direction:row !important;flex-wrap:wrap;justify-content:center}
section.wr-sh>div:last-child>div:last-child>a{flex:1 1 220px}
section[aria-label]:not(.wr-sh)>div:first-child{flex-direction:column;justify-content:center !important;text-align:center}
main section[aria-label],main article,nav.wr-nav{position:relative}
main section[aria-label]:not(.wr-home)::after,main article::after,nav.wr-nav::after{content:"";position:absolute;inset:-32px;pointer-events:none;background-repeat:repeat;background-size:16px 16px;image-rendering:pixelated;animation:wr-wipe .5s step-end both}
@keyframes wr-wipe{0%{background-color:#060606;background-image:none}20%{background-color:transparent;background-image:url(assets/w75.png)}45%{background-color:transparent;background-image:url(assets/w50.png)}70%{background-color:transparent;background-image:url(assets/w25.png)}100%{background-color:transparent;background-image:none}}
.wr-pb{flex:1 1 auto;height:16px;margin:4px;padding:4px;background:#0b0b0b;box-shadow:0 -4px 0 #ffffff,0 4px 0 #ffffff,-4px 0 0 #ffffff,4px 0 0 #ffffff}
.wr-pb-track{height:100%;overflow:hidden;background:repeating-linear-gradient(90deg,#242424 0,#242424 8px,transparent 8px,transparent 12px)}
.wr-pb-fill{position:relative;height:100%;background:repeating-linear-gradient(90deg,#ffffff 0,#ffffff 8px,#0b0b0b 8px,#0b0b0b 12px);animation:wr-fill 1.1s steps(12,end) .35s both}
@keyframes wr-fill{from{width:0}}
@media (prefers-reduced-motion:reduce){main section[aria-label]:not(.wr-home)::after,main article::after,nav.wr-nav::after,.wr-pb-fill{animation:none}}
.wr-pbdone .wr-pb-fill{animation:none}
.wr-shot img,.wr-video img{image-rendering:auto}
.wr-video:hover{border-color:#bdbdbd !important}
@media (max-width:640px){.wr-shots{grid-template-columns:repeat(1,minmax(0,1fr)) !important}}
.wr-title{display:flex;gap:2px;padding-top:12px;color:#ffffff;text-decoration:none}
.wr-title:hover{color:#ffffff}

.wr-foot-dither{height:48px;background:url(assets/w75.png) 0 0 / 16px 16px repeat-x,url(assets/w50.png) 0 16px / 16px 16px repeat-x,url(assets/w25.png) 0 32px / 16px 16px repeat-x;background-color:#111111;image-rendering:pixelated;box-shadow:inset 0 -4px 0 #2e2e2e}
.wr-chip:hover{border-color:#ffffff !important;background:#ffffff !important;color:#0b0b0b !important}
.wr-chip:active,.wr-btn:active{transform:translate(4px,4px)}
.wr-snd{position:fixed;bottom:16px;right:16px;z-index:50;width:64px;height:64px;padding:4px;box-sizing:border-box;display:flex;align-items:center;justify-content:center;background:#060606;color:#ffffff;border:4px solid #5a5a5a;cursor:pointer;image-rendering:pixelated}
.wr-snd:hover{border-color:#ffffff}
.wr-snd[aria-pressed="false"]{color:#5a5a5a}
.wr-snd:focus-visible{outline:4px solid #ffffff;outline-offset:4px}

dd{overflow-wrap:anywhere;min-width:0}

@keyframes wr-typing{from{width:0}}
@keyframes wr-caret{50%{opacity:0}}
.wr-tvbox{width:100%;padding:32px;margin:-32px;box-sizing:content-box;animation:wr-tv .6s steps(8,end) 2.9s both}
.wr-tvbox .wr-sh::before{animation:wr-halo .48s steps(4,end) 3.3s both}
@keyframes wr-halo{0%{opacity:0;inset:-4px}50%{opacity:1;inset:-40px}100%{opacity:1;inset:-28px}}
@keyframes wr-tv{0%{clip-path:inset(50% 50% 50% 50%);filter:brightness(4)}40%{clip-path:inset(calc(50% - 2px) 0 calc(50% - 2px) 0);filter:brightness(4)}100%{clip-path:inset(0);filter:brightness(1)}}
.wr-mos{position:absolute;left:0;top:0;width:100%;height:100%;image-rendering:pixelated;animation:wr-hide .01s step-end both}
@keyframes wr-hide{to{visibility:hidden}}
@keyframes wr-open{from{clip-path:inset(50% 0 50% 0)}to{clip-path:inset(0)}}
.wr-feat-wrap:not(.wr-loaded) .wr-feat-info{visibility:hidden}
.wr-loaded .wr-feat-info>*{animation:wr-pop .32s steps(4,end) both}
.wr-loaded .wr-feat-info>:nth-child(1){animation-delay:4.2s}.wr-loaded .wr-feat-info>:nth-child(2){animation-delay:4.32s}.wr-loaded .wr-feat-info>:nth-child(3){animation-delay:4.44s}.wr-loaded .wr-feat-info>:nth-child(4){animation-delay:4.56s}
@keyframes wr-pop{from{transform:translateY(16px);opacity:0}}
.wr-pbdone .wr-mos{display:none}
.wr-pbdone .wr-tvbox,.wr-pbdone .wr-tvbox .wr-sh::before{animation:none !important}
.wr-pbdone .wr-ch,.wr-pbdone .wr-caret,.wr-pbdone .wr-feat-art,.wr-pbdone .wr-feat-info>*{animation:none !important}
.wr-peek .wr-card{animation:wr-pop .32s steps(4,end) both}.wr-peek .wr-card:nth-child(2){animation-delay:.1s}.wr-peek .wr-card:nth-child(3){animation-delay:.2s}
.wr-cat[aria-expanded="true"]{background:#ffffff !important;color:#0b0b0b !important;border-color:#ffffff !important}
.wr-slider-track{scrollbar-color:#5a5a5a #111111;scrollbar-width:thin}
.wr-slider-track::-webkit-scrollbar{height:8px}.wr-slider-track::-webkit-scrollbar-track{background:#111111}.wr-slider-track::-webkit-scrollbar-thumb{background:#5a5a5a}
.wr-slider-track:focus-visible{outline:4px solid #ffffff;outline-offset:4px}
.wr-slide{text-align:left !important}
.wr-arrow:hover{border-color:#ffffff !important;background:#ffffff !important;color:#0b0b0b !important}
@media (max-width:720px){.wr-type{font-size:16px !important}.wr-feat-wrap h1{font-size:16px !important}.wr-foot-name{font-size:16px !important}}
.wr-feat-art .wr-mos{pointer-events:none}
@media (prefers-reduced-motion:reduce){.wr-mos{display:none}.wr-tvbox,.wr-tvbox .wr-sh::before{animation:none !important}.wr-ch,.wr-caret,.wr-feat-art,.wr-loaded .wr-feat-info>*,.wr-peek .wr-card{animation:none !important}}
.wr-ch{display:inline-block;animation:wr-chpop .12s steps(3,end) both}
@keyframes wr-chpop{0%{visibility:hidden;transform:translateY(-8px)}1%{visibility:visible;transform:translateY(-8px)}100%{visibility:visible;transform:none}}
@keyframes wr-show{from{visibility:hidden}}
.wr-caret{display:inline-block;width:.5em;height:.75em;margin-left:.15em;background:#ffffff;vertical-align:-.05em;animation:wr-show .01s step-end 2.05s both,wr-caret .25s step-end 2.05s 4}
.wr-feat-wrap .wr-type{margin-top:-8px !important}
.wr-ico:hover{color:#ffffff !important;transform:translateY(-4px)}
.wr-ico:active{transform:translate(4px,4px)}
.wr-ico:focus-visible{outline:4px solid #ffffff;outline-offset:4px}
.wr-foot-name{justify-content:center}
.wr-foot-name .wr-l{color:#ffffff}
.wr-card:hover{border-color:#ffffff !important}
.wr-btn:hover{border-color:#ffffff !important}
.wr-btn:focus-visible,.wr-card:focus-visible,.wr-link:focus-visible{outline:4px solid #ffffff;outline-offset:3px}
@media (max-width:640px){.wr-nav{grid-template-columns:repeat(2,minmax(0,1fr)) !important}}
@media (max-width:560px){main h1{font-size:16px !important}.wr-grid{grid-template-columns:repeat(1,minmax(0,1fr)) !important}.wr-nav{grid-template-columns:repeat(1,minmax(0,1fr)) !important}.wr-pad{padding-left:28px !important;padding-right:28px !important}.wr-logo{font-size:16px !important}}
</style>
<style>
.dc-if{display:contents}
[hidden]{display:none !important}
.wr-stage{position:relative;width:100%}
.wr-kick{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;box-sizing:border-box;pointer-events:none;z-index:2;animation:wr-crtoff .3s steps(5,end) 2.6s both}
@keyframes wr-crtoff{0%{transform:none;filter:brightness(1)}50%{transform:scale(1.04,.04);filter:brightness(3)}99%{transform:scale(0,.04);filter:brightness(3);visibility:visible}100%{transform:scale(0,0);visibility:hidden}}
.wr-pbdone .wr-kick{display:none}

.wr-wait .wr-ch,.wr-wait .wr-caret,.wr-wait .wr-tvbox,.wr-wait .wr-tvbox .wr-sh::before,.wr-wait .wr-mos,.wr-wait .wr-kick,.wr-wait .wr-feat-info>*{animation-play-state:paused !important}
.wr-wait .wr-kick{visibility:hidden}
.wr-start{display:none;position:absolute;inset:0;z-index:3;align-items:center;justify-content:center;flex-direction:column;gap:16px;border:0;background:transparent;color:#ffffff;cursor:pointer;font-family:'Press Start 2P','Pixelify Sans',monospace;font-size:32px;line-height:1.5;text-transform:uppercase;text-shadow:4px 4px 0 #3a3a3a}
.wr-start small{font-size:16px;color:#a8a8a8;text-shadow:none;text-transform:none}
.wr-start span{animation:wr-caret 1s step-end infinite}
.wr-wait .wr-start{display:flex}
.wr-start:focus-visible{outline:4px solid #ffffff;outline-offset:-12px}
@media (max-width:720px){.wr-start{font-size:16px}}
</style>

    var self = this;
    var snd = this.sndOn();
    var slide = function (dir) {
      return function () {
        self.beep('tick');
        var t = document.querySelector('.wr-slider-track');
        if (t) t.scrollBy({ left: dir * Math.max(264, Math.floor(t.clientWidth * 0.8 / 264) * 264), behavior: 'smooth' });
      };
    };
    var out = {
      on0: home,
      goHome: function () { self.beep('back'); self.setState({ view: 'inicio', post: null, peek: null }); },
      goTop: function () {
        self.beep('up');
        self.setState({ view: 'inicio', post: null, peek: null });
        setTimeout(function () { try { window.scrollTo({ top: 0, behavior: 'smooth' }); } catch (e) {} }, 30);
      },
      hov: function () { self.beep('hover', false, true); },
      rootCls: (st.pbDone ? 'wr-pbdone' : '') + (st.started ? '' : ' wr-wait'),
      startIntro: function () { self.start(); },
      featCls: st.featLoaded ? 'wr-loaded' : '',
      featLoad: function () { if (!self.state.featLoaded) self.setState({ featLoaded: true }); },
      slidePrev: slide(-1),
      slideNext: slide(1),
      sndOn: snd,
      sndOff: !snd,
      sndLabel: snd ? 'Desligar som' : 'Ligar som',
      toggleSnd: function () {
        var v = !snd;
        try { window.localStorage.setItem('wr-som', v ? '1' : '0'); } catch (e) {}
        if (v) self.beep('on', true);
        self.setState({ snd: v });
      }
    };
    ids.forEach(function (id, i) {
      var n = i + 1;
      out['on' + n] = !post && view === id;
      out['pk' + n] = home && peek === id;
      out['pick' + n] = function () {
        self.beep(peek === id ? 'confirm' : 'peek');
        if (peek === id) { self.setState({ view: id, post: null, peek: null }); return; }
        self.setState({ peek: id });
        setTimeout(function () {
          var el = [].slice.call(document.querySelectorAll('.wr-peek')).filter(function (x) { return x.offsetParent !== null; })[0];
          if (el) window.scrollTo({ top: el.getBoundingClientRect().top + window.pageYOffset - 24, behavior: 'smooth' });
        }, 80);
      };
      out['all' + n] = function () { self.beep('confirm'); self.setState({ view: id, post: null, peek: null }); };
    });
    for (var h = 0; h < 12; h++) out['hovL' + h] = (function (k) { return function () { self.beep('hovL' + k, false, true); }; })(h);
    Object.keys(cats).forEach(function (pid) {
      out['p_' + pid] = post === pid;
      out['open_' + pid] = function () { self.beep('open'); self.setState({ post: pid }); };
      out['back_' + pid] = function () { self.beep('back'); self.setState({ post: null }); };
    });
    return out;
  }
}
  var CATS = ['ports', 'ferramentas', 'traducoes', 'reviews'];
  comp = new Component({ telaInicial: 'inicio' });
  function hashFor(st) {
    if (st.post) return st.post;
    if (st.view && st.view !== 'inicio') return st.view;
    return '';
  }
  function stateFromHash() {
    var h = decodeURIComponent((location.hash || '').slice(1));
    if (h && ('p_' + h) in vals) return { post: h };
    if (CATS.indexOf(h) !== -1) return { view: h, post: null };
    return { view: 'inicio', post: null };
  }
  function render() {
    if (rendering) return;
    rendering = true;
    vals = comp.renderVals();
    document.querySelectorAll('[data-if]').forEach(function (el) { el.hidden = !vals[el.getAttribute('data-if')]; });
    document.querySelectorAll('*').forEach(function (el) {
      for (var i = 0; i < el.attributes.length; i++) {
        var at = el.attributes[i];
        if (at.name.indexOf('data-b-') === 0) el.setAttribute(at.name.slice(7), String(vals[at.value]));
      }
    });
    document.querySelectorAll('[data-bclass]').forEach(function (el) {
      el.className = (el.getAttribute('data-bbase') + ' ' + (vals[el.getAttribute('data-bclass')] || '')).trim();
    });
    var h = hashFor(comp.state);
    if (mounted && ('#' + h) !== (location.hash || '#') && !(h === '' && !location.hash)) {
      history.pushState(null, '', h ? '#' + h : location.pathname + location.search);
      if (window.__wrGoTop) window.scrollTo(0, 0);
    }
    rendering = false;
  }
  document.addEventListener('click', function (ev) {
    var el = ev.target.closest('[data-act]');
    if (!el) return;
    var fn = vals[el.getAttribute('data-act')];
    if (typeof fn !== 'function') return;
    ev.preventDefault();
    var before = hashFor(comp.state);
    fn();
    if (hashFor(comp.state) !== before) window.scrollTo(0, 0);
  });
  document.addEventListener('mouseover', function (ev) {
    var el = ev.target.closest('[data-hover]');
    if (!el || (ev.relatedTarget && el.contains(ev.relatedTarget))) return;
    var fn = vals[el.getAttribute('data-hover')];
    if (typeof fn === 'function') fn();
  });
  window.addEventListener('popstate', function () {
    Object.assign(comp.state, stateFromHash());
    render();
    window.scrollTo(0, 0);
  });
  render();
  document.querySelectorAll('img[data-onload]').forEach(function (img) {
    var fire = function () { var f = vals[img.getAttribute('data-onload')]; if (typeof f === 'function') f(); };
    if (img.complete && img.naturalWidth) fire(); else img.addEventListener('load', fire);
  });
  Object.assign(comp.state, stateFromHash());
  render();
  mounted = true;
  if (comp.componentDidMount) comp.componentDidMount();
})();

</script>
